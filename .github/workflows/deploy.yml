# CI/CD: on every push to main, build and test the gateway, push the Docker image
# to Docker Hub, then SSH into the VPS and restart the stack.
name: Deploy CoffeeNChill

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build the gateway
        run: dotnet build CoffeeNChillGateway/CoffeeNChillGateway.csproj -c Release

      - name: Run tests
        run: dotnet test CoffeeNChillGateway/CoffeeNChillGateway.csproj -c Release --no-build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./CoffeeNChillGateway
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-gateway:v3.0
            ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-gateway:${{ github.sha }}

      - name: Deploy to the VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/CLDV6212POE_CoffeeNChill
            git pull
            docker compose pull
            docker compose up -d
